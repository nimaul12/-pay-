<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#064e3b" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Rounded Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bgGrad)" />

  <!-- Inner Subtle Border -->
  <rect x="24" y="24" width="464" height="464" rx="102" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.25" />

  <!-- Golden Central Disc -->
  <circle cx="256" cy="256" r="170" fill="url(#goldGrad)" filter="url(#shadow)" />
  <circle cx="256" cy="256" r="156" fill="#047857" />

  <!-- Bengali Taka Symbol ৳ in Golden White -->
  <text x="256" y="325" font-family="'Hind Siliguri', sans-serif" font-size="220" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" filter="url(#shadow)">
    ৳
  </text>
</svg>
